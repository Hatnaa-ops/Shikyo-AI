      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: #0a0f1a;
        color: #e8ecf4;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .gradient-bg {
        background:
          radial-gradient(
            ellipse 100% 80% at 50% 0%,
            rgba(0, 212, 170, 0.08),
            transparent
          ),
          radial-gradient(
            ellipse 80% 60% at 20% 80%,
            rgba(78, 205, 196, 0.05),
            transparent
          ),
          radial-gradient(
            ellipse 60% 40% at 80% 60%,
            rgba(255, 107, 107, 0.04),
            transparent
          ),
          #0a0f1a;
      }

      .map-container {
        position: relative;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
      }

      /* World Map SVG */
      .world-map-svg {
        width: 100%;
        height: auto;
        filter: drop-shadow(0 0 40px rgba(0, 212, 170, 0.1));
      }

      .world-map-svg path {
        fill: #141b2d;
        stroke: #1e2a45;
        stroke-width: 0.5;
        transition: fill 0.3s ease;
      }

      /* AI Star Marker */
      .ai-star {
        position: absolute;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 10;
      }

      .ai-star:hover {
        transform: scale(1.3);
        z-index: 20;
      }

      .ai-star.active {
        transform: scale(1.5);
        z-index: 30;
      }

      .star-icon {
        width: 28px;
        height: 28px;
        position: relative;
      }

      .star-icon::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle,
          var(--star-color) 0%,
          transparent 70%
        );
        animation: starPulse 2s ease-in-out infinite;
        border-radius: 50%;
      }

      .star-icon svg {
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 0 8px var(--star-color));
      }

      @keyframes starPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.8);
          opacity: 0;
        }
      }

      .star-label {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        font-size: 10px;
        font-weight: 600;
        color: #e8ecf4;
        margin-top: 4px;
        opacity: 0;
        transition: opacity 0.2s;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      }

      .ai-star:hover .star-label {
        opacity: 1;
      }

      /* Expanded AI Card */
      .ai-card-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(10, 15, 26, 0.9);
        backdrop-filter: blur(10px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
      }

      .ai-card-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      .ai-detail-card {
        background: linear-gradient(145deg, #141b2d, #1a2238);
        border: 1px solid #1e2a45;
        border-radius: 20px;
        padding: 32px;
        max-width: 500px;
        width: 90%;
        transform: scale(0.8) translateY(20px);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow:
          0 25px 50px -12px rgba(0, 0, 0, 0.5),
          0 0 60px -15px var(--card-glow);
      }

      .ai-card-overlay.active .ai-detail-card {
        transform: scale(1) translateY(0);
      }

      .ai-detail-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid #1e2a45;
      }

      .ai-detail-icon {
        width: 60px;
        height: 60px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--icon-from), var(--icon-to));
      }

      .ai-detail-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: #fff;
      }

      .ai-detail-company {
        color: #00d4aa;
        font-size: 14px;
        font-weight: 500;
      }

      .ai-detail-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        margin-bottom: 20px;
      }

      .ai-detail-stat {
        background: rgba(0, 212, 170, 0.05);
        border: 1px solid rgba(0, 212, 170, 0.1);
        border-radius: 12px;
        padding: 14px;
      }

      .stat-label {
        font-size: 11px;
        color: #6b7a99;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
      }

      .stat-value {
        font-family: "Space Grotesk", sans-serif;
        font-size: 18px;
        font-weight: 600;
        color: #e8ecf4;
      }

      .ai-detail-desc {
        color: #a0aec0;
        line-height: 1.7;
        font-size: 14px;
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .close-btn:hover {
        background: rgba(255, 107, 107, 0.2);
        border-color: #ff6b6b;
      }

      /* Legend */
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(20, 27, 45, 0.8);
        border: 1px solid #1e2a45;
        border-radius: 20px;
        font-size: 12px;
      }

      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      /* Constellation lines */
      .constellation-line {
        stroke: rgba(0, 212, 170, 0.15);
        stroke-width: 1;
        stroke-dasharray: 4 4;
      }

      /* Animations */
      .fade-in {
        animation: fadeIn 0.8s ease forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .star-appear {
        animation: starAppear 0.5s ease forwards;
        opacity: 0;
      }

      @keyframes starAppear {
        from {
          opacity: 0;
          transform: scale(0);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .star-icon::before,
        .ai-star,
        .ai-detail-card {
          animation: none;
          transition: none;
        }
      }

      @media (max-width: 768px) {
        .map-container {
          height: 400px;
        }
        .star-label {
          display: none;
        }
        .ai-detail-grid {
          grid-template-columns: 1fr;
        }
      }

      function createStarSVG(color) {
        return `<svg width="24" height="24" viewBox="0 0 24 24" fill="${color}">
                <path d="M12 2L14.09 8.26L21 9.27L16 14.14L17.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z"/>
            </svg>`;
      }

      // Create AI markers
      function createMarkers() {
        aiData.forEach((ai, index) => {
          const marker = document.createElement("div");
          marker.className = "ai-star star-appear";
          marker.style.left = `${ai.x}%`;
          marker.style.top = `${ai.y}%`;
          marker.style.animationDelay = `${index * 0.05 + 0.3}s`;
          marker.style.setProperty("--star-color", ai.color);

          marker.innerHTML = `
                    <div class="star-icon">
                        ${createStarSVG(ai.color)}
                    </div>
                    <span class="star-label">${ai.name}</span>
                `;

          marker.addEventListener("click", () => openCard(ai));
          markersContainer.appendChild(marker);
        });
      }

      // Open AI card
      function openCard(ai) {
        activeCard = ai;

        const iconFrom = ai.color;
        const iconTo = ai.color + "80";

        detailContent.style.setProperty("--card-glow", ai.color + "40");
        detailContent.style.setProperty("--icon-from", iconFrom);
        detailContent.style.setProperty("--icon-to", iconTo);

        detailContent.innerHTML = `
                <div class="ai-detail-header">
                    <div class="ai-detail-icon">
                        ${createStarSVG("#fff")}
                    </div>
                    <div>
                        <h3 class="ai-detail-title">${ai.name}</h3>
                        <p class="ai-detail-company">${ai.company}</p>
                    </div>
                </div>
                
                <div class="ai-detail-grid">
                    <div class="ai-detail-stat">
                        <div class="stat-label">Гарсан он</div>
                        <div class="stat-value">${ai.year}</div>
                    </div>
                    <div class="ai-detail-stat">
                        <div class="stat-label">Ангилал</div>
                        <div class="stat-value">${ai.category}</div>
                    </div>
                    <div class="ai-detail-stat">
                        <div class="stat-label">Бүс нутаг</div>
                        <div class="stat-value">${getRegionName(ai.region)}</div>
                    </div>
                    <div class="ai-detail-stat">
                        <div class="stat-label">Төлөв</div>
                        <div class="stat-value" style="color: #00d4aa;">Идэвхтэй</div>
                    </div>
                </div>
                
                <div class="ai-detail-desc">
                    <strong style="color: #e8ecf4;">Танилцуулга:</strong><br><br>
                    ${ai.desc}
                </div>
            `;

        overlay.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      // Close card
      function closeCard() {
        overlay.classList.remove("active");
        document.body.style.overflow = "";
        activeCard = null;
      }

      // Get region name
      function getRegionName(region) {
        const regions = {
          us: "АНУ",
          cn: "Хятад",
          eu: "Европ",
          other: "Бусад",
        };
        return regions[region] || "Тодорхойгүй";
      }

      // Close on overlay click
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) {
          closeCard();
        }
      });

      // Close on Escape key
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeCard();
        }
      });

      // Initialize markers on load
      document.addEventListener("DOMContentLoaded", createMarkers);
    </script>
  </body>
  <script>
    (function () {
      if (!window.chatbase || window.chatbase("getState") !== "initialized") {
        window.chatbase = (...arguments) => {
          if (!window.chatbase.q) {
            window.chatbase.q = [];
          }
          window.chatbase.q.push(arguments);
        };
        window.chatbase = new Proxy(window.chatbase, {
          get(target, prop) {
            if (prop === "q") {
              return target.q;
            }
            return (...args) => target(prop, ...args);
          },
        });
      }
      const onLoad = function () {
        const script = document.createElement("script");
        script.src = "https://www.chatbase.co/embed.min.js";
        script.id = "YQa7mO6D98j95T3hFx2IC";
        script.domain = "www.chatbase.co";
        document.body.appendChild(script);
      };
      if (document.readyState === "complete") {
        onLoad();
      } else {
        window.addEventListener("load", onLoad);
      }
    })();
  </script>
</html>
